
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülesanne 6 – Lorem Picsum pildid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333333;
        }

        .pildigalerii {
            display: grid;
            grid-template-columns: repeat(3, 300px);
            gap: 15px;
            justify-content: center;
            margin: 30px auto;
        }

        .pildigalerii img {
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        footer {
            margin-top: 30px;
            padding: 15px;
            color: #555555;
        }
    </style>
</head>

<body>

    <h1>Minu pildigalerii</h1>

    <p>
        Sellel veebilehel on üheksa juhuslikku pilti,
        mis on võetud Lorem Picsum pilditeenusest.
    </p>

    <div class="pildigalerii">
        <img src="https://picsum.photos/seed/pilt1/300/300"
             alt="Esimene juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt2/300/300"
             alt="Teine juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt3/300/300"
             alt="Kolmas juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt4/300/300"
             alt="Neljas juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt5/300/300"
             alt="Viies juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt6/300/300"
             alt="Kuues juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt7/300/300"
             alt="Seitsmes juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt8/300/300"
             alt="Kaheksas juhuslik pilt"
             width="300" height="300" loading="lazy">

        <img src="https://picsum.photos/seed/pilt9/300/300"
             alt="Üheksas juhuslik pilt"
             width="300" height="300" loading="lazy">
    </div>

    <footer>
        <p>Autor: Margus Paat | 2026</p>
    </footer>

</body>
</html>
