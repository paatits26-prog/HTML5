
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülesanne 7 – Video, muusika ja kaart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #444;
            margin-top: 30px;
        }

        iframe {
            max-width: 100%;
            border: none;
            margin-bottom: 20px;
        }

        .sisu {
            margin: 20px auto;
        }

        footer {
            margin-top: 30px;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>Minu multimeedia veebileht</h1>

    <p>
        Sellel veebilehel saab vaadata videot,
        kuulata muusikat ja tutvuda Tallinna vanalinnaga kaardil.
    </p>

    <div class="sisu">




<h2>1. YouTube video – Tallinna vanalinn</h2>

<iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/aqz-KE-bpKQ"
    title="YouTube testvideo"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>




        <h2>2. Spotify muusika</h2>

        <iframe
            style="border-radius:12px"
            src="https://open.spotify.com/embed/track/4uLU6hMCjMI75M1A2tKUQC"
            width="300"
            height="152"
            title="Spotify muusikapleier"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>

        <h2>3. Google Maps – Tallinna vanalinn</h2>

        <iframe
            src="https://www.google.com/maps?q=Tallinna+Vanalinn&output=embed"
            width="600"
            height="450"
            title="Tallinna vanalinna kaart"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

    </div>

    <footer>
        <p>Autor: Margus Paat | 2026</p>
    </footer>

</body>
</html>
